<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AURA</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/resumo.css') }}"
    />
  </head>

  <body>
    <header class="navbar">
      <div class="navbar__container">
        <a href="#" class="navbar__logo">
          <img
            src="{{ url_for('static', filename='img/logo-roxo.png') }}"
            alt="AURA"
            class="navbar__logo-img"
          />
        </a>
        <nav class="navbar__nav" id="nav-menu">
          <a href="/#projetos" class="navbar__link">Projetos</a>
          <a href="/#sobre-aura" class="navbar__link">Sobre</a>
          <a href="/#sobre-nos" class="navbar__link">Equipe</a>
          <a href="/#contato" class="navbar__link">Contato</a>
          <a href="{{ url_for('perfil') }}" class="navbar__link">Perfil</a>
        </nav>
        <button
          class="navbar__hamburger"
          id="hamburger"
          aria-label="Abrir menu"
        >
          <span></span><span></span><span></span>
        </button>
      </div>
    </header>
    
    <main class="resumo-page">
      <div class="resumo-card">
        <div class="resumo-card__header">
          <h1 class="resumo-titulo">Gerar Resumo</h1>
          <button class="btn-copiar" id="btn-copiar">
            <svg
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2" />
              <path
                d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"
              />
            </svg>
            <span id="btn-copiar-texto">Copiar</span>
          </button>
        </div>

        <div class="resumo-conteudo" id="resumo-conteudo">
          <h2 class="resumo-subtitulo">Resumo</h2>
          <div class="resumo-texto" id="resumo-texto"></div>
        </div>
      </div>
    </main>

    <script src="{{ url_for('static', filename='js/resumo.js') }}"></script>
  </body>
</html>
