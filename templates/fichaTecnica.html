<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AURA</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/fichaTecnica.css') }}"
    />
  </head>
  <body>
    <header class="navbar">
      <div class="navbar__container">
        <a href="#" class="navbar__logo">
          <img
            src="{{ url_for('static', filename='img/logo-roxo.png') }}"
            alt="AURA"
            class="navbar__logo-img"
          />
        </a>
        <nav class="navbar__nav" id="nav-menu">
          <a href="/#projetos" class="navbar__link">Projetos</a>
          <a href="/#sobre-aura" class="navbar__link">Sobre</a>
          <a href="/#sobre-nos" class="navbar__link">Equipe</a>
          <a href="/#contato" class="navbar__link">Contato</a>
          <a href="{{ url_for('perfil') }}" class="navbar__link">Perfil</a>
        </nav>
        <button
          class="navbar__hamburger"
          id="hamburger"
          aria-label="Abrir menu"
        >
          <span></span><span></span><span></span>
        </button>
      </div>
    </header>

    <main class="ficha-page">
      <div class="ficha-card">
        <div class="ficha-card__header">
          <h1 class="ficha-titulo">Ficha técnica</h1>
          <button class="btn-exportar" id="btn-exportar" disabled>
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
              <polyline points="17 8 12 3 7 8" />
              <line x1="12" y1="3" x2="12" y2="15" />
            </svg>
            Exportar
          </button>
        </div>

        <div class="ficha-conteudo" id="ficha-conteudo"></div>
      </div>
    </main>

    <script src="{{ url_for('static', filename='js/fichaTecnica.js') }}"></script>
  </body>
</html>
